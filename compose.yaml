x-kalamar-setup: &kalamar-setup
  # Discover the physical Linux host automatically for maintenance notices.
  uts: host
  entrypoint: []
  command: >
    sh -c '
      if [ -f /kalamar/conf/kalamar.conf ]; then
        echo "Using custom configuration conf/kalamar.conf";
        cp /kalamar/conf/kalamar.conf /kalamar/kalamar.production.conf;
      fi;
      if [ "$$KALAMAR_EXPORT" = "false" ]; then unset KALAMAR_EXPORT_SERVICE; fi;
      perl script/kalamar daemon -l http://0.0.0.0:64543'
volumes:
  example-index:
services:
  examplecontainer:
    image: "docker.io/korap/example-index:0.1"
    profiles:
      - example
    volumes:
      - "example-index:/kustvakt/index"
    restart: "no"
  kalamar:
    image: ${KALAMAR_IMAGE:-docker.io/korap/kalamar:0.67.0-beta.6}
    ports:
      - "${KALAMAR_PORT:-64543}:64543"
    environment:
      KALAMAR_API: "http://kustvakt:8089/api/"
      KALAMAR_EXPORT: ${KALAMAR_EXPORT:-true}
      KORAP_HOSTNAME: "${KORAP_HOSTNAME:-}"
      KALAMAR_EXPORT_SERVICE: "http://kalamar-export:7777"
    volumes:
      # Templates describing your own corpus; see custom/README.md.
      - ${KALAMAR_TEMPLATES:-./custom}:/kalamar/templates/custom:ro,z
      # Custom Kalamar configuration; see conf/README.md.
      - ${KALAMAR_CONF_DIR:-./conf}:/kalamar/conf:ro,z
    depends_on:
      - kustvakt
    profiles:
      - open
    <<: *kalamar-setup
    restart: "unless-stopped"
  auth-init:
    image: ${KALAMAR_IMAGE:-docker.io/korap/kalamar:0.67.0-beta.6}
    command: super_client_info kalamar /kalamar/data/super_client_info
    volumes:
      - type: bind
        source: "${PWD}/data/"
        target: "/kalamar/data"
        bind:
          selinux: z
    profiles:
      - auth
      - init
    user: root
    restart: "no"
  kalamar-auth:
    image: ${KALAMAR_IMAGE:-docker.io/korap/kalamar:0.67.0-beta.6}
    ports:
      - "${KALAMAR_PORT:-64543}:64543"
    environment:
      KALAMAR_API: "http://kustvakt-auth:8089/api/"
      KALAMAR_PLUGINS: "Auth"
      KALAMAR_CLIENT_FILE: "/kalamar/data/super_client_info"
      KALAMAR_EXPORT: ${KALAMAR_EXPORT:-true}
      KORAP_HOSTNAME: "${KORAP_HOSTNAME:-}"
      KALAMAR_EXPORT_SERVICE: "http://kalamar-export:7777"
    volumes:
      # The directory, not the file: Podman would create a missing file as a directory
      - ${PWD}/data/:/kalamar/data:ro,z
      # Templates describing your own corpus; see custom/README.md.
      - ${KALAMAR_TEMPLATES:-./custom}:/kalamar/templates/custom:ro,z
      # Custom Kalamar configuration; see conf/README.md.
      - ${KALAMAR_CONF_DIR:-./conf}:/kalamar/conf:ro,z
    depends_on:
      kustvakt-auth:
        condition: service_started
      auth-init:
        condition: service_completed_successfully
    profiles:
      - auth
    <<: *kalamar-setup
    restart: "unless-stopped"
    user: root
  kalamar-export:
    image: "docker.io/korap/kalamar-plugin-export:0.5.2"
    profiles:
      - open
      - auth
      - export
    restart: "unless-stopped"
  kustvakt:
    image: "docker.io/korap/kustvakt:1.4.1"
    expose:
      - 8089
    volumes:
      - "${INDEX}:/kustvakt/index:z"
    profiles:
      - open
    networks:
      default:
        aliases:
          - kustvakt-api
    restart: "unless-stopped"
  kustvakt-auth-init:
    # Copy the image's default full configuration to ./data/kustvakt.conf,
    # unless it already exists, as the bind mount below hides it.
    image: "docker.io/korap/kustvakt:1.4.1"
    entrypoint: ["cp", "-n", "/kustvakt/data/kustvakt.conf", "/data/kustvakt.conf"]
    command: []
    volumes:
      - type: bind
        source: "${PWD}/data/"
        target: /data/
        bind:
          selinux: z
    profiles:
      - auth
    user: root
    restart: "no"
  kustvakt-auth:
    image: "docker.io/korap/kustvakt:1.4.1"
    # The same image runs the lite version by default
    command: ["Kustvakt.jar", "--full"]
    expose:
      - 8089
    user: root
    volumes:
      - "${INDEX}:/kustvakt/index:z"
      - type: bind
        source: "${PWD}/data/"
        target: /kustvakt/data/
        bind:
          selinux: z
    profiles:
      - auth
    depends_on:
      auth-init:
        condition: service_completed_successfully
      kustvakt-auth-init:
        condition: service_completed_successfully
    networks:
      default:
        aliases:
          - kustvakt-api
          - kustvakt
    restart: "unless-stopped"
configs:
  super_client_info:
    external: true
